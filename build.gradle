plugins {
    id 'java-library'
    id 'fabric-loom' version '1.13-SNAPSHOT'
    id 'maven-publish'

    id 'dev.yumi.gradle.licenser' version '4.0.0'
    id 'io.github.tomtzook.gradle-cmake' version '1.2.2' apply false  // native-math style: for Rust cdylib builds later
}

// ---------------------------------------------------------------------------
// Basic project identity
// ---------------------------------------------------------------------------

base {
    archivesName = "${project.archives_base_name}-mc${project.minecraft_version}"
}
group = project.maven_group
version = project.mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// Compile-time stubs for C2ME types we call (see src/stub). They are
// compiled into their own source set and added to `compileOnly` below, so
// the main classes get type-checked against them but they are NOT packaged
// into the jar — at runtime C2ME provides the real classes. Declaring only
// the members we use avoids pinning a C2ME version.
sourceSets {
    stub {
        java.srcDir 'src/stub/java'
    }
}
tasks.withType(AbstractArchiveTask) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Stub classes must exist before the main sources that reference them compile.
compileJava.dependsOn tasks.named('compileStubJava')

// ---------------------------------------------------------------------------
// Fabric Loom + Minecraft deps (versions come from gradle.properties)
// ---------------------------------------------------------------------------

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    // ModMenu is a soft, compile-time-only dependency: its maven is only
    // consulted when resolving that one artifact.
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    mavenLocal()
    mavenCentral()
}

dependencies {
    // Type-checked against the stub signatures; the stub classes are not
    // shipped (compileOnly + separate source set). See the stub sourceSet.
    compileOnly sourceSets.stub.output
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // ModMenu is optional at runtime. `modCompileOnly` gives us the API to
    // type-check the screen against without making ModMenu a hard dependency;
    // the entrypoint is only registered when the mod is actually present.
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    // NOTE: no C2ME compile dependency. The async scheduling path (DEVELOPMENT
    // §18.6b) reaches c2me-base's SchedulingManager via REFLECTION, so we do
    // not link against C2ME at build time. Rationale: C2ME class names are not
    // remapped by Loom, and reflection degrades gracefully (falls back to the
    // synchronous path) if C2ME's API changes — a compile dependency would
    // hard-crash at runtime on a signature mismatch.

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
    useJUnitPlatform()
}

// ---------------------------------------------------------------------------
// Loom
// ---------------------------------------------------------------------------

loom {
    // Our own access widener (no longer borrowed from C2ME). Widens the
    // package-private DensityFunctionTypes$* inner classes our serializer
    // touches; required at runtime too, not just compile time.
    accessWidenerPath = file("src/main/resources/c2me-opts-accel-wgpu.accesswidener")
    enableTransitiveAccessWideners = false

    runs {
        server { ideConfigGenerated true }
        client { ideConfigGenerated true }
    }
}

// ---------------------------------------------------------------------------
// License headers — use the bundled MIT LICENSE file for all sources.
// ---------------------------------------------------------------------------

license {
    include '**/*.java'
    include '**/*.rs'
    rule file('LICENSE')
}

jar {
    from('LICENSE') { rename { "${it}_MIT" } }
}

// ---------------------------------------------------------------------------
// Resources: expand ${version} in fabric.mod.json, same as upstream C2ME.
// ---------------------------------------------------------------------------

processResources {
    inputs.property 'version', version
    filesMatching('fabric.mod.json') { expand 'version': version }
}

// ---------------------------------------------------------------------------
// Rust cdylib build
//
// Compiles the Rust crate with `cargo build --release` and stages the native
// library under build/rust-natives/, which is registered as an extra resource
// directory. The library ends up in the JAR at:
//   natives/<os>-<arch>/libc2me_wgpu.so    (Linux)
//   natives/<os>-<arch>/libc2me_wgpu.dylib (macOS)
//   natives/<os>-<arch>/c2me_wgpu.dll      (Windows)
// which is exactly where NativeLoader looks it up.
//
// Output goes to build/ (NOT src/) so no source-scanning task (sourcesJar,
// checkLicense, ...) picks it up as an implicit input.
//
// Use `-PskipRust` to skip the Rust build (e.g. CI without a Rust toolchain).
// ---------------------------------------------------------------------------

def rustDir = file('rust')

def normalizeOs(String v) {
    v = v.toLowerCase(Locale.US).replaceAll("[^a-z0-9]+", "")
    if (v.startsWith("linux")) return "linux"
    if (v.startsWith("macosx") || v.startsWith("osx") || v.startsWith("darwin")) return "macos"
    if (v.startsWith("windows")) return "windows"
    return "unknown"
}

def normalizeArch(String v) {
    v = v.toLowerCase(Locale.US).replaceAll("[^a-z0-9]+", "")
    if (v.matches('^(x8664|amd64|ia32e|em64t|x64)$')) return "x86_64"
    if (v.matches('^(x8632|x86|i[3-6]86|ia32|x32)$')) return "x86_32"
    // "arm64" is what Apple JDKs sometimes report on Apple Silicon;
    // aarch64 is the canonical name the natives directory uses.
    // Bare "arm" is deliberately NOT mapped: that means 32-bit ARMv7, and
    // reporting "unknown" gives a clearer "no native library" message than
    // the dlopen "wrong ELF class" a mis-mapped lookup would produce.
    if (v == "aarch64" || v == "arm64") return "aarch64"
    return "unknown"
}

def rustOs = normalizeOs(System.getProperty("os.name", ""))
def rustArch = normalizeArch(System.getProperty("os.arch", ""))
def rustLibName = System.mapLibraryName("c2me_wgpu")
def rustNativesRoot = layout.buildDirectory.dir("rust-natives").get().asFile
def rustStageDir = new File(rustNativesRoot, "natives/${rustOs}-${rustArch}")

if (!project.hasProperty('skipRust') || !project.property('skipRust').toBoolean()) {
    tasks.register('rustBuild') {
        group = 'build'
        description = 'Compile the Rust wgpu native library and stage it for JAR packaging.'
        inputs.dir(new File(rustDir, 'src'))
        inputs.file(new File(rustDir, 'Cargo.toml'))
        inputs.file(new File(rustDir, 'Cargo.lock'))
        outputs.dir(rustStageDir)

        doLast {
            logger.lifecycle("[c2me-wgpu] Running cargo build --release in ${rustDir}")
            def proc = new ProcessBuilder('cargo', 'build', '--release')
                    .directory(rustDir)
                    .inheritIO()
                    .start()
            int code = proc.waitFor()
            if (code != 0) {
                throw new GradleException("cargo build --release failed with exit code ${code}")
            }
            def built = new File(rustDir, "target/release/${rustLibName}")
            if (!built.exists()) {
                throw new GradleException("Rust library not found after build: ${built}")
            }
            rustStageDir.mkdirs()
            copy {
                from built
                into rustStageDir
            }
            logger.lifecycle("[c2me-wgpu] Staged native library -> ${rustStageDir}/${rustLibName}")
        }
    }
    processResources.dependsOn rustBuild
    sourcesJar.dependsOn rustBuild
    checkLicenseMain.dependsOn rustBuild

    // -- Windows cross-compilation (optional) -------------------------------
    // When a windows rustup target is installed and we're not already on
    // Windows, also build the DLL and stage it into natives/windows-<arch>/,
    // so the same jar runs on Windows. Silently skipped otherwise.
    def windowsTargets = []
    try {
        def p = new ProcessBuilder('rustup', 'target', 'list', '--installed').start()
        p.inputStream.withReader { r -> r.readLines().each { line ->
            def t = line.trim()
            if (t == 'x86_64-pc-windows-gnu' || t == 'x86_64-pc-windows-msvc'
                    || t == 'aarch64-pc-windows-msvc') {
                windowsTargets.add(t)
            }
        } }
        p.waitFor()
    } catch (Throwable ignored) {}
    // Prefer gnu (self-contained linker) over msvc (needs a Windows SDK).
    windowsTargets = windowsTargets.sort { a, b ->
        (a.endsWith('-gnu') ? 0 : 1) <=> (b.endsWith('-gnu') ? 0 : 1)
    }

    if (rustOs != 'windows' && !windowsTargets.isEmpty()
            && (!project.hasProperty('skipRust') || !project.property('skipRust').toBoolean())) {
        def winTarget = windowsTargets.get(0)
        def winArch = winTarget.startsWith('aarch64') ? 'aarch64' : 'x86_64'
        def winStageDir = new File(rustNativesRoot, "natives/windows-${winArch}")

        tasks.register('rustBuildWindows') {
            group = 'build'
            description = "Cross-compile the Rust cdylib for ${winTarget} and stage the DLL."
            inputs.dir(new File(rustDir, 'src'))
            inputs.file(new File(rustDir, 'Cargo.toml'))
            inputs.file(new File(rustDir, 'Cargo.lock'))
            outputs.dir(winStageDir)

            doLast {
                logger.lifecycle("[c2me-wgpu] Cross-compiling Windows native (${winTarget})")
                def proc = new ProcessBuilder('cargo', 'build', '--release', '--target', winTarget)
                        .directory(rustDir)
                        .inheritIO()
                        .start()
                int code = proc.waitFor()
                if (code != 0) {
                    throw new GradleException("cargo build --target ${winTarget} failed with exit code ${code}")
                }
                def built = new File(rustDir, "target/${winTarget}/release/c2me_wgpu.dll")
                if (!built.exists()) {
                    throw new GradleException("Windows DLL not found after build: ${built}")
                }
                winStageDir.mkdirs()
                copy {
                    from built
                    into winStageDir
                }
                logger.lifecycle("[c2me-wgpu] Staged Windows native -> ${winStageDir}/c2me_wgpu.dll")
            }
        }
        processResources.dependsOn rustBuildWindows
        sourcesJar.dependsOn rustBuildWindows
    }

    // -- Android cross-compilation (opt-in: needs NDK + cargo-ndk) ----------
    // Runs when ANDROID_NDK_HOME is set; disable with -PskipAndroid.
    // ABIs via -PandroidAbis=arm64-v8a,armeabi-v7a (default arm64-v8a).
    def androidAbis = (project.findProperty('androidAbis') ?: 'arm64-v8a').toString().split(',')
    def abiToTarget = ['arm64-v8a':'aarch64-linux-android',
                       'armeabi-v7a':'armv7-linux-androideabi',
                       'x86_64':'x86_64-linux-android',
                       'x86':'i686-linux-android']
    def abiToArchDir = ['arm64-v8a':'aarch64',
                        'armeabi-v7a':'armv7',
                        'x86_64':'x86_64',
                        'x86':'x86_32']
    boolean buildAndroid = System.getenv('ANDROID_NDK_HOME') != null
            && !(project.hasProperty('skipAndroid') && project.property('skipAndroid').toBoolean())

    if (buildAndroid) {
        tasks.register('rustBuildAndroid') {
            group = 'build'
            description = 'Cross-compile the Rust cdylib for Android ABIs (cargo-ndk).'
            inputs.dir(new File(rustDir, 'src'))
            inputs.file(new File(rustDir, 'Cargo.toml'))
            inputs.file(new File(rustDir, 'Cargo.lock'))
            outputs.dir(rustNativesRoot)

            doLast {
                androidAbis.each { abi ->
                    abi = abi.trim()
                    def target = abiToTarget[abi]
                    def archDir = abiToArchDir[abi]
                    if (target == null) {
                        throw new GradleException("Unknown Android ABI: ${abi}")
                    }
                    logger.lifecycle("[c2me-wgpu] cargo ndk -t ${abi} build --release")
                    def proc = new ProcessBuilder('cargo', 'ndk', '-t', abi, 'build', '--release')
                            .directory(rustDir)
                            .inheritIO()
                            .start()
                    int code = proc.waitFor()
                    if (code != 0) {
                        throw new GradleException("cargo ndk build for ${abi} failed (exit ${code})")
                    }
                    def built = new File(rustDir, "target/${target}/release/${rustLibName}")
                    if (!built.exists()) {
                        throw new GradleException("Android lib not found: ${built}")
                    }
                    def stageDir = new File(rustNativesRoot, "natives/android-${archDir}")
                    stageDir.mkdirs()
                    copy {
                        from built
                        into stageDir
                    }
                    logger.lifecycle("[c2me-wgpu] Staged Android native -> ${stageDir}/${rustLibName}")
                }
            }
        }
        processResources.dependsOn rustBuildAndroid
        sourcesJar.dependsOn rustBuildAndroid
        checkLicenseMain.dependsOn rustBuildAndroid
    } else {
        logger.lifecycle("[c2me-wgpu] Android build skipped (ANDROID_NDK_HOME unset or -PskipAndroid)")
    }

    // ── OpenHarmony build ──
    // Cross-compiles for aarch64-unknown-linux-ohos with `cargo-ohos`.
    //
    // Both the cargo subcommand and the OHOS SDK are required. Checking only
    // the subcommand is not enough: a developer who happens to have cargo-ohos
    // installed for another project would get a hard build failure here,
    // because `cargo ohos build` cannot work without the SDK. That is exactly
    // what a fresh clone on such a machine used to do.
    boolean buildOhos = !(project.hasProperty('skipOhos') && project.property('skipOhos').toBoolean())
            && System.getenv('OHOS_SDK_NATIVE') != null

    if (buildOhos) {
        // Check if cargo-ohos is available
        try {
            def checkProc = new ProcessBuilder('cargo', 'ohos', '--version')
                    .directory(rustDir)
                    .redirectErrorStream(true)
                    .start()
            int checkCode = checkProc.waitFor()
            if (checkCode != 0) {
                buildOhos = false
            }
        } catch (Exception e) {
            buildOhos = false
        }
    }

    if (buildOhos) {
        tasks.register('rustBuildOhos') {
            group = 'build'
            description = 'Cross-compile the Rust cdylib for OpenHarmony (cargo-ohos).'
            inputs.dir(new File(rustDir, 'src'))
            inputs.file(new File(rustDir, 'Cargo.toml'))
            inputs.file(new File(rustDir, 'Cargo.lock'))
            outputs.dir(rustNativesRoot)

            doLast {
                logger.lifecycle("[c2me-wgpu] cargo ohos build -r")
                def proc = new ProcessBuilder('cargo', 'ohos', 'build', '-r')
                        .directory(rustDir)
                        .inheritIO()
                        .start()
                int code = proc.waitFor()
                if (code != 0) {
                    throw new GradleException("cargo ohos build failed (exit ${code})")
                }
                def built = new File(rustDir, "target/aarch64-unknown-linux-ohos/release/${rustLibName}")
                if (built.exists()) {
                    def stageDir = new File(rustNativesRoot, "natives/ohos-aarch64")
                    stageDir.mkdirs()
                    copy {
                        from built
                        into stageDir
                    }
                    logger.lifecycle("[c2me-wgpu] Staged OHOS native -> ${stageDir}/${rustLibName}")
                } else {
                    logger.lifecycle("[c2me-wgpu] OHOS native lib not found after build, skipping staging.")
                }
            }
        }
        processResources.dependsOn rustBuildOhos
        sourcesJar.dependsOn rustBuildOhos
        checkLicenseMain.dependsOn rustBuildOhos
    } else {
        def reason = System.getenv('OHOS_SDK_NATIVE') == null
                ? "OHOS_SDK_NATIVE unset"
                : "cargo-ohos not found"
        logger.lifecycle("[c2me-wgpu] OHOS build skipped (${reason})")
    }


    // ── macOS cross-compilation (osxcross) ──
    // macOS natives cannot be produced by `cargo build` on Linux directly:
    // linking needs the macOS SDK (Metal.framework, Foundation.framework, ...).
    // osxcross supplies a clang wrapper plus an SDK, and the Rust target is
    // built with that toolchain.
    //
    // Detection:
    //   1. OSXCROSS_ROOT must be set, or osxcross must live in one of the
    //      usual places (/opt/osxcross, ~/osxcross, ...).
    //   2. $OSXCROSS_ROOT/bin must contain a *-apple-darwin*-clang wrapper.
    //   3. $OSXCROSS_ROOT/SDK must contain a MacOSX*.sdk directory.
    // Anything missing means the task is skipped with an explanatory log line,
    // matching how the Android and OHOS blocks behave.
    //
    // Disable with -PskipMacOS. Targets are controlled by -PmacosTargets
    // (comma separated, default aarch64-apple-darwin).

    def osxcrossRoot = System.getenv('OSXCROSS_ROOT')
    if (osxcrossRoot == null) {
        def candidates = [
                '/opt/osxcross',
                System.getProperty('user.home') + '/osxcross',
                System.getProperty('user.home') + '/.osxcross'
        ]
        for (c in candidates) {
            if (new File(c, 'bin').isDirectory()) {
                osxcrossRoot = c
                break
            }
        }
    }

    def macosClang = null
    def macosSdk = null
    if (osxcrossRoot != null) {
        def binDir = new File(osxcrossRoot, 'bin')
        if (binDir.isDirectory()) {
            // Prefer aarch64 wrapper; the x86_64 build uses its own wrapper
            // discovered the same way below, but a single probe is enough to
            // decide the toolchain is present.
            macosClang = binDir.listFiles()?.find { it.name.contains('apple-darwin') && it.name.endsWith('-clang') }
        }
        def sdkRoot = new File(osxcrossRoot, 'SDK')
        if (sdkRoot.isDirectory()) {
            macosSdk = sdkRoot.listFiles()?.find { it.name.startsWith('MacOSX') && it.isDirectory() }
        }
    }

    boolean buildMacOS = !(project.hasProperty('skipMacOS') && project.property('skipMacOS').toBoolean())
            && osxcrossRoot != null
            && macosClang != null
            && macosSdk != null
            && !(project.hasProperty('skipRust') && project.property('skipRust').toBoolean())

    if (buildMacOS) {
        def macosTargets = (project.findProperty('macosTargets') ?: 'aarch64-apple-darwin')
                .toString().split(',').collect { it.trim() }

        tasks.register('rustBuildMacos') {
            group = 'build'
            description = 'Cross-compile the Rust cdylib for macOS (osxcross).'
            inputs.dir(new File(rustDir, 'src'))
            inputs.file(new File(rustDir, 'Cargo.toml'))
            inputs.file(new File(rustDir, 'Cargo.lock'))
            outputs.dir(rustNativesRoot)

            doLast {
                macosTargets.each { target ->
                    def archDir = target.startsWith('aarch64') ? 'aarch64' : 'x86_64'
                    def stageDir = new File(rustNativesRoot, "natives/macos-${archDir}")
                    // osxcross binaries are named after the SDK version, e.g.
                    // aarch64-apple-darwin23-clang; look up the one matching
                    // this target's architecture rather than hardcoding a
                    // version.
                    def archPrefix = target.startsWith('aarch64') ? 'aarch64' : 'x86_64'
                    def clang = new File(osxcrossRoot, 'bin').listFiles()?.find {
                        it.name.startsWith(archPrefix) && it.name.contains('apple-darwin') && it.name.endsWith('-clang')
                    }
                    if (clang == null) {
                        throw new GradleException(
                                "No ${archPrefix}-apple-darwin*-clang found under ${osxcrossRoot}/bin")
                    }

                    logger.lifecycle("[c2me-wgpu] Cross-compiling macOS native (${target}) with ${clang.name}")
                    def env = new HashMap<String, String>(System.getenv())
                    // .toString() is required: Groovy string interpolation
                    // yields a GString, which cannot be stored in a
                    // HashMap<String, String>.
                    env.put('PATH', "${osxcrossRoot}/bin:${env.getOrDefault('PATH', '')}".toString())
                    env.put('SDKROOT', macosSdk.absolutePath)
                    // cc-rs looks these up when building C dependencies; the
                    // underscores are how cargo passes target-specific vars.
                    env.put("CC_${target.replace('-', '_')}".toString(), clang.absolutePath)
                    def ar = clang.absolutePath.replaceAll('-clang$', '-ar')
                    if (new File(ar).exists()) {
                        env.put("AR_${target.replace('-', '_')}".toString(), ar)
                    }
                    // Rust's own linker is selected through the wrapper clang;
                    // setting RUSTFLAGS is unnecessary because the wrapper is
                    // discovered as the linker via CARGO_TARGET_<TARGET>_LINKER.
                    env.put("CARGO_TARGET_${target.toUpperCase().replace('-', '_')}_LINKER".toString(),
                            clang.absolutePath)

                    def proc = new ProcessBuilder('cargo', 'build', '--release', '--target', target)
                            .directory(rustDir)
                            .inheritIO()
                    proc.environment().putAll(env)
                    int code = proc.start().waitFor()
                    if (code != 0) {
                        throw new GradleException("cargo build --target ${target} failed (exit ${code})")
                    }
                    def built = new File(rustDir, "target/${target}/release/libc2me_wgpu.dylib")
                    if (!built.exists()) {
                        throw new GradleException("macOS dylib not found after build: ${built}")
                    }
                    stageDir.mkdirs()
                    copy {
                        from built
                        into stageDir
                    }
                    logger.lifecycle("[c2me-wgpu] Staged macOS native -> ${stageDir}/libc2me_wgpu.dylib")
                }
            }
        }
        processResources.dependsOn rustBuildMacos
        sourcesJar.dependsOn rustBuildMacos
        checkLicenseMain.dependsOn rustBuildMacos
    } else {
        logger.lifecycle("[c2me-wgpu] macOS build skipped (osxcross not found or -PskipMacOS)")
    }

    // Package the staged natives into the JAR explicitly (avoids registering
    // build/rust-natives as a source set, which would confuse license/source scans).
    processResources {
        from(rustNativesRoot) {
            into ''
        }
    }
} else {
    logger.lifecycle("[c2me-wgpu] -PskipRust set: skipping Rust native build")
}

// ---------------------------------------------------------------------------
// Maven publish (useful for snapshot artifacts locally).
// ---------------------------------------------------------------------------

publishing {
    publications {
        mavenJava(MavenPublication) { from components.java }
    }
    repositories {
        // mavenLocal()
    }
}



