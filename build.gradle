plugins {
    id 'java-library'
    id 'fabric-loom' version '1.17-SNAPSHOT'
    id 'net.fabricmc.fabric-loom-repositories' version '1.17-SNAPSHOT'
    id 'maven-publish'
    id 'dev.yumi.gradle.licenser' version '4.0.0'
    id 'io.github.tomtzook.gradle-cmake' version '1.2.2' apply false  // native-math style: for Rust cdylib builds later
}

// ---------------------------------------------------------------------------
// Basic project identity
// ---------------------------------------------------------------------------

base {
    archivesName = "${project.archives_base_name}-mc${project.minecraft_version}"
}
group = project.maven_group
version = project.mod_version

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
tasks.withType(AbstractArchiveTask) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// ---------------------------------------------------------------------------
// Fabric Loom + Minecraft deps (versions come from gradle.properties)
// ---------------------------------------------------------------------------

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://repo.codemc.io/repository/relativitymc/' }
    // JitPack — builds C2ME-fabric directly from GitHub tags/commits/master-SNAPSHOT
    // https://jitpack.io/#RelativityMC/C2ME-fabric
    maven { url = 'https://jitpack.io' }
    maven {
        url = 'https://maven.bawnorton.com/releases'
        content { includeGroup 'com.github.bawnorton.mixinsquared' }
    }
    mavenLocal()
    mavenCentral()
}

// Choose C2ME dependency coordinates based on c2me_resolution from gradle.properties.
// Coordinates are materialized here (rather than inline) so settings.gradle
// includeBuild dependencySubstitution can still match the remote module names.
def c2meGroup    = project.hasProperty('c2me_resolution') && project.c2me_resolution == 'jitpack'
                  ? 'com.github.RelativityMC.C2ME-fabric'
                  : 'com.ishland.c2me'
def c2meVersion  = project.hasProperty('c2me_resolution') && project.c2me_resolution == 'jitpack'
                  ? project.c2me_jitpack_version
                  : project.c2me_version

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "org.relativitymc:modern-yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // C2ME modules.
    // When a local C2ME-fabric checkout exists, settings.gradle includeBuild
    // substitutes these coordinates with live Gradle projects regardless of
    // c2me_resolution setting.
    modApi "${c2meGroup}:c2me-base:${c2meVersion}"
    modApi "${c2meGroup}:c2me-opts-dfc:${c2meVersion}"

    // Shared runtime libs — keep aligned with C2ME-fabric/gradle.properties versions
    implementation "com.ibm.async:asyncutil:${async_util_version}"
    implementation "com.electronwill.night-config:toml:${night_config_version}"
    implementation annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:${mixinsquared_version}")

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
    useJUnitPlatform()
}

// ---------------------------------------------------------------------------
// Loom
// ---------------------------------------------------------------------------

loom {
    // Access widener lives inside c2me-base, which we depend on.
    enableTransitiveAccessWideners = true

    runs {
        server { ideConfigGenerated true }
        client { ideConfigGenerated true }
    }
}

// ---------------------------------------------------------------------------
// License headers — use the bundled MIT LICENSE file for all sources.
// ---------------------------------------------------------------------------

license {
    include '**/*.java'
    include '**/*.rs'
    rule file('LICENSE')
}

jar {
    from('LICENSE') { rename { "${it}_MIT" } }
}

// ---------------------------------------------------------------------------
// Resources: expand ${version} in fabric.mod.json, same as upstream C2ME.
// ---------------------------------------------------------------------------

processResources {
    inputs.property 'version', version
    filesMatching('fabric.mod.json') { expand 'version': version }
}

// ---------------------------------------------------------------------------
// Rust cdylib build (placeholder hook; enable when you wire a cargo Gradle
// plugin or call `cargo build --release` in CI and copy the lib into the JAR
// natives/<os>-<arch>/ folder).
//
// Layout expected by Java NativeLoader:
//   src/main/resources/natives/linux-x86_64/libc2me_wgpu.so
//   src/main/resources/natives/macos-x86_64/libc2me_wgpu.dylib
//   src/main/resources/natives/macos-aarch64/libc2me_wgpu.dylib
//   src/main/resources/natives/windows-x86_64/c2me_wgpu.dll
// ---------------------------------------------------------------------------

