// ---------------------------------------------------------------------------
// Maven publish (useful for snapshot artifacts locally).
// ---------------------------------------------------------------------------

publishing {
    publications {
        mavenJava(MavenPublication) { from components.java }
    }
    repositories {
        // mavenLocal()
    }
}

remapJar { addNestedDependencies = true }
