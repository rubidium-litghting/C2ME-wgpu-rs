[package]
name = "c2me-wgpu"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["RubidiumLighting"]
description = "C2ME's wgpu acceleration module, with fp32 as the primary target."

[lib]
name = "c2me_wgpu"
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = "30"
naga = "30"
pollster = "1"
anyhow = "1"
bitflags = "2"
rustc-hash = "2"
lz4_flex = "0.14"
crc32fast = "1"
bytemuck = { version = "1", features = ["derive"] }
crossbeam = "0.8"
parking_lot = "0.12"

# Windows: one call to GlobalMemoryStatusEx, used only to decide whether two
# GPU instances can safely coexist during a rebuild. wgpu-hal already pulls
# windows-sys in on this target, so pinning the same major version adds no new
# build graph.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
rand = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[lints.clippy]
# Every `pub unsafe extern "C"` function is a contract with the Java side;
# the obligations must be written next to the signature, not memorised.
# See DEVELOPMENT.md #24 / #26 for why these boundaries matter here.
missing_safety_doc = "deny"
# Kept as a warning: most blocks here are one-line FFI wrappers (`write_err`,
# `from_raw_parts`) whose obligations are already stated in the enclosing
# function's `# Safety`. Denying would demand the same comment 27 times.
undocumented_unsafe_blocks = "warn"
