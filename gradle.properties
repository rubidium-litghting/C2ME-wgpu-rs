# Done to increase the memory available to gradle and improve build times.
org.gradle.jvmargs=-Xmx5G
org.gradle.parallel=true
org.gradle.warning.mode=all
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk
org.gradle.java.installations.paths=/usr/lib/jvm/java-25-openjdk

gradle-curseforge-publish.interop.fabric-loom=false
gradle-curseforge-publish.interop.forge-gradle=false
gradle-curseforge-publish.interop.neoforged=false
gradle-curseforge-publish.interop.neogradle=false

maven_use_gpr=0

#org.gradle.configuration-cache=true
# Fabric Properties
# check these on https://fabricmc.net/versions.html
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.1
loader_version=0.17.2
fabric_version=0.116.0+1.21.1
# Mod Properties
mod_version=0.1.8
maven_group=com.rubidiumlighting.c2me
archives_base_name=c2me-opts-accel-wgpu
# Publishing metadtaa
curseforge_minecraft_versions=1.21.1
# No C2ME build-time configuration: this mod does not depend on C2ME at
# compile time. C2ME remains a required *runtime* dependency (see
# fabric.mod.json), because it provides the chunk-generation parallelism
# that the GPU batching relies on for throughput.
junit_version=5.11.3
# ModMenu API, compile-time only (soft dependency).
modmenu_version=11.0.3
